<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo -->
    <!-- Imagem principal (LCP): mesmas larguras e `sizes` do <picture> em src/sections/hero/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/src/assets/images/hero/hero-desktop-1200.avif 1200w, /src/assets/images/hero/hero-desktop-1800.avif 1800w"
      imagesizes="62vw"
      media="(min-width: 60em)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/src/assets/images/hero/hero-mobile-600.avif 600w, /src/assets/images/hero/hero-mobile-900.avif 900w"
      imagesizes="100vw"
      media="(max-width: 59.99em)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
